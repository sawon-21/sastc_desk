  <!-- CSS File -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap');

:root {
  --primary: #8B5CF6;
  --primary-light: #A78BFA;
  --primary-dark: #7C3AED;
  --dark: #111827;
  --dark-light: #1F2937;
  --card-bg: #1F2937;
  --success: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
  --info: #3B82F6;
  --new-highlight: rgba(139, 92, 246, 0.2);
  --text-muted: #9CA3AF;
  --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

body {
  background: #0f131b;
  color: white;
  font-family: 'Hind Siliguri', sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  padding: 2px;
}

h5 {
  font-size: 17px;
}

/* Auth Page Styles */
.auth-page {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #0f131b 0%, #1a1f2e 100%);
}

.auth-container {
  width: 100%;
  max-width: 400px;
  padding: 30px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.auth-form-container {
  animation: fadeIn 0.5s ease;
}

.auth-input {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: white;
  border-radius: 10px;
  padding: 12px 15px;
  transition: all 0.3s;
}

.auth-input:focus {
  background: rgba(255, 255, 255, 0.15);
  border-color: var(--primary);
  color: white;
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
}

.auth-input::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

.auth-link {
  color: var(--primary-light);
  text-decoration: none;
  font-weight: 600;
}

.auth-link:hover {
  color: var(--primary);
  text-decoration: underline;
}

.btn-primary {
  background: var(--primary);
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-weight: 600;
  transition: all 0.3s;
}

.btn-primary:hover {
  background: var(--primary-dark);
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
}

/* User Info Styles */
.user-info {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}

.user-name {
  font-weight: 600;
  font-size: 14px;
  color: white;
}

.user-id {
  font-size: 12px;
  color: var(--text-muted);
}

.user-name-sm {
  font-size: 14px;
  font-weight: 600;
  color: white;
}

.logout-btn {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
}

.logout-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: rotate(90deg);
}

/* Header */
.header {
  background: #404751;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 1rem 0;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
}

.app-title {
  font-weight: 400;
  letter-spacing: -0.5px;
  background: linear-gradient(90deg, #EC4899 0%, yellow 50%, #3B82F6 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-size: 1.5rem;
  font-family: "Bitcount Grid Double", system-ui;
  animation: titleGradient 8s ease infinite;
  background-size: 200% 200%;
}

@keyframes titleGradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Post Card */
.post-card {
  background: #0f131b;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid rgba(255,255,255,0.05);
  box-shadow: var(--card-shadow);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(5px);
}

.post-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
  border-color: blue;
  background: #0f131b;
}

.post-card.new::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: red;
}

.post-card.new {
  background: #000035;
}

.post-card.new::after {
  content: 'LATEST';
  position: absolute;
  top: 10px;
  right: -30px;
  width: 100px;
  text-align: center;
  background: linear-gradient(45deg, red, black);
  color: white;
  font-size: 0.7rem;
  font-weight: bold;
  transform: rotate(45deg);
  padding: 2px 0;
  box-shadow: 0 2px 10px yellow;
  z-index: 1;
}

.post-type {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.3s;
}

.type-classes {   
  background: #0ea5e9;
  color: #fff;
  box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.3);
}

.type-notice {   
  background: var(--primary);  
  color: #fff;
  box-shadow: 0 4px 6px -1px rgba(139, 92, 246, 0.3);  
}

.type-important {   
  background: #ff4d4f;
  color: #fff;  
  box-shadow: 0 4px 6px -1px rgba(255, 77, 79, 0.3);  
}

.type-update {   
  background: var(--warning);   
  color: #000;  
  box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3);  
}

.type-assignment {   
  background: #00cec9;  
  color: #000;
  box-shadow: 0 4px 6px -1px #00cec9;  
}

.type-exam {   
  background: #2563eb;
  color: #fff;  
  box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);  
}

.type-resources {   
  background: #059669;
  color: #fff;  
  box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.3);  
}

.type-event {   
  background: #f97316;
  color: #fff;  
  box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.3);  
}

.type-tips {   
  background: lime;
  color: #000;  
  box-shadow: 0 4px 6px -1px lime;  
}

.type-suggestion {   
  background: #9333ea;
  color: #fff;  
  box-shadow: 0 4px 6px -1px rgba(147, 51, 234, 0.3);  
}

.type-news {   
  background: #a29bfe;
  color: #000;  
  box-shadow: 0 4px 6px -1px rgba(55, 65, 81, 0.3);  
}

.post-image-container {
  position: relative;
  width: 100%;
  border-radius: 12px;
  margin: 16px 0;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 8px 15px rgba(0,0,0,0.2);
}

.post-image {
  width: 100%;
  border-radius: 12px;
  max-height: 400px;
  object-fit: cover;
  transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.post-image-container:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 20px rgba(0,0,0,0.3);
}

.post-image-container:hover .post-image {
  transform: scale(1.05);
}

.post-image-container::after {
  content: '\F33E';
  font-family: 'bootstrap-icons';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2rem;
  color: white;
  opacity: 0;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  transition: all 0.3s ease;
  pointer-events: none;
}

.post-image-container:hover::after {
  opacity: 0.8;
  transform: translate(-50%, -50%) scale(1.2);
}

/* Lightbox */
.lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.lightbox.active {
  opacity: 1;
  pointer-events: all;
}

.lightbox-img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
  border-radius: 8px;
  transform: scale(0.9);
  transition: transform 0.3s ease;
}

.lightbox.active .lightbox-img {
  transform: scale(1);
}

.lightbox-close {
  position: absolute;
  top: 30px;
  right: 30px;
  font-size: 2rem;
  color: white;
  cursor: pointer;
  background: rgba(255,255,255,0.1);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.lightbox-close:hover {
  background: rgba(255,255,255,0.2);
  transform: rotate(90deg);
}

/* Reaction Buttons */
.reaction-buttons {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.reaction-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.9rem;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  font-weight: 600;
  position: relative;
  overflow: hidden;
}

.reaction-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
  transform: translateX(-100%);
  transition: transform 0.4s ease;
}

.reaction-btn:hover::before {
  transform: translateX(100%);
}

.reaction-btn:hover {
  background: rgba(255,255,255,0.2);
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.reaction-btn.like.active {
  background: var(--success);
  color: white;
  box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
}

.reaction-btn.dislike.active {
  background: var(--danger);
  color: white;
  box-shadow: 0 4px 8px rgba(239, 68, 68, 0.3);
}

.reaction-btn.comment-btn {
  background: rgba(255,255,255,0.1);
  color: white;
}

.reaction-btn.comment-btn:hover {
  background: rgba(59, 130, 246, 0.3);
}

.reaction-btn.bookmark.active {
  background: var(--warning);
  color: #000;
}

.reaction-btn.share-btn {
  background: rgba(139, 92, 246, 0.2);
  color: var(--primary);
}

.reaction-btn.share-btn:hover {
  background: rgba(139, 92, 246, 0.3);
}

/* Empty State */
.empty-state {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 60px 20px;
  text-align: center;
  margin-top: 40px;
  backdrop-filter: blur(5px);
  border: 1px solid rgba(255,255,255,0.1);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
  70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); }
  100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
}

.empty-state i {
  font-size: 3.5rem;
  opacity: 0.5;
  margin-bottom: 1.5rem;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

.time-badge {
  font-size: 0.75rem;
  background: rgba(255,255,255,0.1);
  padding: 5px 12px;
  border-radius: 20px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.3s;
}

.time-badge:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.05);
}

/* Search Box */
.search-box {
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  border-radius: 20px;
  padding: 8px 20px;
  width: 100%;
  max-width: 400px;
  transition: all 0.3s;
  font-size: 0.95rem;
  backdrop-filter: blur(5px);
  border: 1px solid rgba(255,255,255,0.1);
}

.search-box:focus {
  background: #131313;
  color: white;
  box-shadow: 0 0 0 1px #3B82F6;
  outline: none;
}

/* Filter Buttons */
.filter-btn {
  background: #F3F3F3;
  border: none;
  color: #131313;
  border-radius: 15px;
  padding: 8px 15px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  font-weight: 800;
  backdrop-filter: blur(50px);
  border: 1px solid #131313;
}

.filter-btn:hover {
  background: #0d6e99;
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.filter-btn.active {
  background: #0d6efd;
  box-shadow: 2 4px 6px -1px rgba(13,110,253,255);
  border-color: #131313;
}

/* Filters Row */
.filters-row-wrapper {
  position: sticky;
  top: 0px;
  z-index: 999;
  padding: 10px 0;
  overflow-x: auto;
  white-space: nowrap;
  backdrop-filter: blur(100px);
  border-bottom: 1px solid #ddd;
}

.filters-row-wrapper::-webkit-scrollbar {
  display: none;
}

.filter-btn {
  display: inline-block;
  margin: 0 5px;
  white-space: nowrap;
}

/* Post Content */
.post-content {
  line-height: 1.6;
  font-size: 14px;
  color: rgba(255,255,255,0.9);
  margin-bottom: 15px;
  position: relative;
}

.post-content.expanded {
  max-height: none;
}

.read-more {
  color: #3B82F6;
  font-weight: 600;
  cursor: pointer;
  display: inline-block;
  margin-top: 5px;
  background: rgba(59, 130, 246, 0.1);
  padding: 4px 12px;
  border-radius: 15px;
  font-size: 13px;
  transition: all 0.3s;
}

.read-more:hover {
  background: rgba(59, 130, 246, 0.2);
  text-decoration: none;
  transform: translateY(-1px);
}

.post-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.post-title {
  font-weight: 700;
  margin-bottom: 12px;
  font-size: 1.5rem;
  line-height: 1.3;
  color: white;
  position: relative;
  display: inline-block;
}

.post-title::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 0;
  width: 50px;
  height: 3px;
  background: linear-gradient(90deg, var(--primary), transparent);
  border-radius: 3px;
  transition: width 0.3s ease;
}

.post-card:hover .post-title::after {
  width: 100%;
}

.post-detail-label {
  font-weight: 600;
  color: var(--primary-light);
  margin-right: 8px;
}

.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  background: gold;
  font-family: 'Poppins', sans-serif;
  color: black;
  padding: 5px 50px;
  border-radius: 19px;
  text-decoration: none;
  font-weight: 900;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 6px -1px rgba(139, 92, 246, 0.3);
  position: relative;
  overflow: hidden;
}

.link-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: all 0.5s ease;
}

.link-btn:hover::before {
  left: 100%;
}

.link-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 15px -3px rgba(139, 92, 246, 0.4);
  color: white;
}

/* Skeleton Loading */
.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, #0f131b 50%, rgba(255,255,255,0.1) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 8px;
  backdrop-filter: blur(50px);
  border: 1px solid rgba(255,255,255,0.1);
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.skeleton-card {
  height: 150px;
  margin-bottom: 24px;
  border-radius: 16px;
}

/* Toast Message */
.toast-message {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: green;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  z-index: 99999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.toast-message.show {
  opacity: 1;
  transform: translateX(-50%) translateY(-5px);
}

/* Install Prompt */
.install-prompt {
  display:none;
  position: none;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #00072D;
  color: white;
  z-index: 9999;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.3s ease forwards;
  text-align: center;
  padding: 20px;
}

.install-prompt h1 {
  font-weight: bold;
}

.install-prompt p {
  color: var(--primary-light);
  max-width: 300px;
}

@media (display-mode: standalone) {
  .install-prompt {
    display: none !important;
  }
}

/* Floating particles background */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  overflow: hidden;
}

.particle {
  position: absolute;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  animation: float-particle 15s infinite linear;
}

@keyframes float-particle {
  0% {
    transform: translateY(0) translateX(0);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  90% {
    opacity: 1;
  }
  100% {
    transform: translateY(-100vh) translateX(100px);
    opacity: 0;
  }
}

/* Page Styles */
.page {
  display: block;
  width: 100%;
  min-height: 100vh;
}

.back-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  padding: 8px 16px;
  border-radius: 10px;
  transition: all 0.3s;
}

.back-btn:hover {
  background: rgba(255,255,255,0.2);
  transform: translateX(-3px);
}

/* Full Post Content */
.full-post-content {
  font-size: 16px;
  line-height: 1.8;
  color: rgba(255,255,255,0.9);
  margin-bottom: 30px;
  white-space: pre-wrap;
}

/* Comments Section */
.comments-section {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.1);
}

.comment-item {
  background: rgba(255,255,255,0.05);

// Initialize Firebase
firebase.initializeApp(firebaseConfig);

// DOM Elements

// PWA Installation

}

window.addEventListener('beforeinstallprompt', (e) => {

  if (promptElement) {

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {

document.addEventListener('DOMContentLoaded', () => {
  createParticles();
  setupEventListeners();
  checkAuthState();
  
  // Check online status

    showOfflinePopup();

});

// Check authentication state
function checkAuthState() {
  auth.onAuthStateChanged((user) => {
    if (user) {
      console.log('User is signed in:', user.uid);
      currentUser = user;
      loadUserData();
      showMainPage();
    } else {
      console.log('No user signed in');
      showAuthPage();
    }
  });
}

  authPage.style.display = 'flex';
  mainPage.style.display = 'none';
  fullPostPage.style.display = 'none';
}

// Show main page
function showMainPage() {
  authPage.style.display = 'none';
  mainPage.style.display = 'block';
  fullPostPage.style.display = 'none';
  
  // Update user info display
  updateUserInfo();
  
  // Load posts
  loadPosts();
  
  // Start title animation
  startTitleAnimation();
}

// Update user info display
function updateUserInfo() {
  if (currentUser) {
    // Try to get user data from database first
    database.ref(`users/${currentUser.uid}`).once('value')
      .then((snapshot) => {
        const userData = snapshot.val();
        if (userData) {
          // Save to localStorage
          localStorage.setItem('userData', JSON.stringify(userData));
          
          // Update display
          userNameDisplay.textContent = userData.name || 'User';
          userIdDisplay.textContent = `ID: ${userData.studentId || 'N/A'}`;
          fullPageUserName.textContent = userData.name || 'User';
        } else {
          // Fallback to localStorage
          const savedData = JSON.parse(localStorage.getItem('userData') || '{}');
          userNameDisplay.textContent = savedData.name || 'User';
          userIdDisplay.textContent = `ID: ${savedData.studentId || 'N/A'}`;
          fullPageUserName.textContent = savedData.name || 'User';
        }
      })
      .catch((error) => {
        console.error('Error fetching user data:', error);
        const savedData = JSON.parse(localStorage.getItem('userData') || '{}');
        userNameDisplay.textContent = savedData.name || 'User';
        userIdDisplay.textContent = `ID: ${savedData.studentId || 'N/A'}`;
        fullPageUserName.textContent = savedData.name || 'User';
      });
  }
}

// Load user data from localStorage
function loadUserData() {
  if (currentUser) {
    const savedReactions = localStorage.getItem(`userReactions_${currentUser.uid}`);
    userReactions = savedReactions ? JSON.parse(savedReactions) : {};
    
    const savedBookmarks = localStorage.getItem(`bookmarks_${currentUser.uid}`);
    bookmarkedPosts = savedBookmarks ? JSON.parse(savedBookmarks) : [];
  }
}

// Save user data to localStorage
function saveUserData() {
  if (currentUser) {
    localStorage.setItem(`userReactions_${currentUser.uid}`, JSON.stringify(userReactions));
    localStorage.setItem(`bookmarks_${currentUser.uid}`, JSON.stringify(bookmarkedPosts));
  }
}

}

function showLogin() {
  document.getElementById('signupForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
  clearAuthErrors();
}

// Clear auth errors
function clearAuthErrors() {
  if (loginError) loginError.style.display = 'none';
  if (signupError) signupError.style.display = 'none';
}

// Show auth error
function showAuthError(element, message) {
  if (element) {
    element.textContent = message;
    element.style.display = 'block';
  }
}

  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const confirmPassword = document.getElementById('signupConfirmPassword').value;
  
  // Clear previous errors
  clearAuthErrors();
  
  // Validation
  if (!name) {
    showAuthError(signupError, 'Please enter your full name');
    return;
  }
  
  if (!studentId) {
    showAuthError(signupError, 'Please enter your student ID');
    return;
  }
  
  if (!password) {
    showAuthError(signupError, 'Please enter a password');
    return;
  }
  
  if (password.length < 6) {
    showAuthError(signupError, 'Password must be at least 6 characters');
    return;
  }
  
  if (password !== confirmPassword) {
    showAuthError(signupError, 'Passwords do not match');
    return;
  }
  
  try {
    // Create user with email (use student ID + domain if no email provided)
    const userEmail = email || `${studentId.toLowerCase()}@sastc.edu`;
    
    console.log('Attempting to create user with email:', userEmail);
    
    const userCredential = await auth.createUserWithEmailAndPassword(userEmail, password);
    console.log('User created successfully:', userCredential.user.uid);
    
    // Save user data to Firebase
    const userData = {
      name: name,
      studentId: studentId,
      email: userEmail,
      createdAt: Date.now()
    };
    
    await database.ref(`users/${userCredential.user.uid}`).set(userData);
    console.log('User data saved to Firebase');
    
    // Save user data to localStorage
    localStorage.setItem('userData', JSON.stringify(userData));
    
    // Update user profile
    await userCredential.user.updateProfile({
      displayName: name
    });
    
    showToast('Account created successfully!');
    
    // Clear form
    document.getElementById('signupName').value = '';
    document.getElementById('signupStudentId').value = '';
    document.getElementById('signupEmail').value = '';
    document.getElementById('signupPassword').value = '';
    document.getElementById('signupConfirmPassword').value = '';
    
    // User will be automatically redirected by auth state listener
    
  } catch (error) {
    console.error('Signup error:', error);
    let errorMessage = 'Signup failed. ';
    
    switch (error.code) {
      case 'auth/email-already-in-use':
        errorMessage += 'This student ID is already registered.';
        break;
      case 'auth/invalid-email':
        errorMessage += 'Invalid email format.';
        break;
      case 'auth/operation-not-allowed':
        errorMessage += 'Email/password accounts are not enabled.';
        break;
      case 'auth/weak-password':
        errorMessage += 'Password is too weak.';
        break;
      default:
        errorMessage += error.message;
    }
    
    showAuthError(signupError, errorMessage);
  }
}

// Login function

  const password = document.getElementById('loginPassword').value;

    const userCredential = await auth.signInWithEmailAndPassword(email, password);
    console.log('Login successful:', userCredential.user.uid);
    
    // Fetch user data from database
    const snapshot = await database.ref(`users/${userCredential.user.uid}`).once('value');
    const userData = snapshot.val();
    
    if (userData) {

// Create floating particles
function createParticles() {
  const particleCount = Math.floor(window.innerWidth / 10);
  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.classList.add('particle');

    const size = Math.random() * 2 + 1;
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;

    particle.style.left = `${Math.random() * 100}%`;
    particle.style.top = `${Math.random() * 100}%`;

    const duration = Math.random() * 15 + 10;
    const delay = Math.random() * 5;
    particle.style.animation = `float-particle ${duration}s ${delay}s infinite linear`;

    particlesContainer.appendChild(particle);
  }
}

// Format text with read more link
function shortText(text, limit = 180) {

  return text.substring(0, limit) +

}

// Load comments for full post
function loadCommentsForFullPost(postId) {
  const commentsList = document.getElementById('commentsList');
  commentsList.innerHTML = '<div class="text-center py-4"><i class="bi bi-chat-text fs-3 text-muted"></i><p class="mt-2">Loading comments...</p></div>';
  
  database.ref(`comments/${postId}`).on('value', (snapshot) => {
    const data = snapshot.val();
    commentsList.innerHTML = '';
    
    if (!data) {
      commentsList.innerHTML = '<div class="text-center py-4"><i class="bi bi-chat-text fs-3 text-muted"></i><p class="mt-2">No comments yet. Be the first to comment!</p></div>';
      return;
    }
    
    let count = 0;
    Object.keys(data).forEach(commentId => {
      const comment = data[commentId];
      count++;
      
      const commentTime = formatTimeAgo(comment.time);
      let repliesHtml = '';
      
      // Load replies if they exist
      if (comment.replies) {
        Object.keys(comment.replies).forEach(replyId => {
          const reply = comment.replies[replyId];
          const replyTime = formatTimeAgo(reply.time);
          repliesHtml += `
            <div class="reply-item">
              <div class="comment-header">
                <span class="comment-author">${reply.name || 'Anonymous'}</span>
                <span class="comment-time">${replyTime}</span>
              </div>
              <div class="comment-text">${reply.text}</div>
            </div>
          `;
        });
      }
      
      const commentHtml = `
        <div class="comment-item" data-comment-id="${commentId}">
          <div class="comment-header">
            <span class="comment-author">${comment.name || 'Anonymous'}</span>
            <span class="comment-time">${commentTime}</span>
          </div>
          <div class="comment-text">${comment.text}</div>
          <button class="reply-btn" onclick="showReplyForm('${commentId}')">
            <i class="bi bi-reply"></i> Reply
          </button>
          <div id="reply-form-${commentId}" class="reply-form" style="display: none;">
            <input type="text" id="reply-text-${commentId}" class="reply-input" placeholder="Write a reply..." maxlength="500">
            <button class="comment-submit-btn" onclick="addReply('${commentId}')">Post Reply</button>
          </div>
          ${repliesHtml ? `<div class="reply-section">${repliesHtml}</div>` : ''}
        </div>
      `;
      
      commentsList.innerHTML += commentHtml;
    });
    
    // Update comment count
    commentCounts[postId] = count;
  });
}

// Show reply form

// Add reply
function addReply(commentId) {
  if (!currentUser) {
    showToast('Please login to reply');
    return;
  }
  
  const textInput = document.getElementById(`reply-text-${commentId}`);
  if (!textInput) return;
  
  const text = textInput.value.trim();
  
  if (!text) {
    showToast('Please write a reply');
    return;
  }
  
  if (!navigator.onLine) {
    showToast('You need to be online to post a reply');
    return;
  }
  
  const userData = JSON.parse(localStorage.getItem('userData') || '{}');
  const replyData = {
    name: userData.name || 'Anonymous',
    text: text,
    time: Date.now(),
    userId: currentUser.uid
  };
  
  database.ref(`comments/${currentPostId}/${commentId}/replies`).push(replyData)
    .then(() => {
      textInput.value = '';
      showToast('Reply posted successfully!');
    })
    .catch(error => {
      console.error('Error posting reply:', error);
      showToast('Failed to post reply');
    });
}

// Handle reaction (like/dislike)
function handleReaction(postId, action) {
  if (!currentUser) {
    showToast('Please login to react');
    return;
  }
  
  if (!navigator.onLine) {
    showToast('You need to be online to react');
    return;
  }
  
  const currentReaction = userReactions[postId];
  
  // If clicking the same reaction again, remove it
  if (currentReaction === action) {
    removeReaction(postId, action);
    return;
  }
  
  // If user already reacted differently, first remove that reaction
  if (currentReaction && currentReaction !== action) {
    removeReaction(postId, currentReaction);
  }
  
  addReaction(postId, action);
}

// Add reaction
function addReaction(postId, action) {
  userReactions[postId] = action;
  saveUserData();
  
  // Update UI
  updateReactionUI(postId, action, true);
  
  // Update in Firebase
  const updateData = {};
  updateData[`posts/${postId}/${action}s`] = firebase.database.ServerValue.increment(1);
  updateData[`userReactions/${currentUser.uid}/${postId}`] = action;
  
  database.ref().update(updateData)
    .catch(error => {
      console.error('Error updating reaction:', error);
      showToast('Failed to update reaction');
    });
}

// Remove reaction
function removeReaction(postId, action) {
  delete userReactions[postId];
  saveUserData();
  
  // Update UI
  updateReactionUI(postId, action, false);
  
  // Update in Firebase
  const updateData = {};
  updateData[`posts/${postId}/${action}s`] = firebase.database.ServerValue.increment(-1);
  updateData[`userReactions/${currentUser.uid}/${postId}`] = null;
  
  database.ref().update(updateData)
    .catch(error => {
      console.error('Error removing reaction:', error);
      showToast('Failed to remove reaction');
    });
}

// Update reaction UI
function updateReactionUI(postId, action, isAdding) {
  // Update in main page if visible
  const mainLikeBtn = document.querySelector(`#mainPage .reaction-btn.like[onclick*="${postId}"]`);
  const mainDislikeBtn = document.querySelector(`#mainPage .reaction-btn.dislike[onclick*="${postId}"]`);
  
  if (mainLikeBtn && mainDislikeBtn) {
    updateButtonState(mainLikeBtn, mainDislikeBtn, action, isAdding);
  }
  
  // Update in full post page if visible
  const fullLikeBtn = document.querySelector(`#fullPostPage .reaction-btn.like[onclick*="${postId}"]`);
  const fullDislikeBtn = document.querySelector(`#fullPostPage .reaction-btn.dislike[onclick*="${postId}"]`);
  
  if (fullLikeBtn && fullDislikeBtn) {
    updateButtonState(fullLikeBtn, fullDislikeBtn, action, isAdding);
  }
}

function updateButtonState(likeBtn, dislikeBtn, action, isAdding) {
  const likeCountEl = likeBtn.querySelector('.like-count');
  const dislikeCountEl = dislikeBtn.querySelector('.dislike-count');
  
  if (action === 'like') {
    if (isAdding) {
      likeBtn.classList.add('active');
      dislikeBtn.classList.remove('active');
      if (likeCountEl) likeCountEl.textContent = parseInt(likeCountEl.textContent || '0') + 1;
      if (dislikeCountEl && dislikeBtn.classList.contains('active')) {
        dislikeCountEl.textContent = Math.max(0, parseInt(dislikeCountEl.textContent || '0') - 1);
      }
    } else {
      likeBtn.classList.remove('active');
      if (likeCountEl) likeCountEl.textContent = Math.max(0, parseInt(likeCountEl.textContent || '0') - 1);
    }
  } else {
    if (isAdding) {
      dislikeBtn.classList.add('active');
      likeBtn.classList.remove('active');
      if (dislikeCountEl) dislikeCountEl.textContent = parseInt(dislikeCountEl.textContent || '0') + 1;
      if (likeCountEl && likeBtn.classList.contains('active')) {
        likeCountEl.textContent = Math.max(0, parseInt(likeCountEl.textContent || '0') - 1);
      }
    } else {
      dislikeBtn.classList.remove('active');
      if (dislikeCountEl) dislikeCountEl.textContent = Math.max(0, parseInt(dislikeCountEl.textContent || '0') - 1);
    }
  }
}

// Toggle bookmark
function toggleBookmark(postId) {
  if (!currentUser) {
    showToast('Please login to bookmark');
    return;
  }
  
  const index = bookmarkedPosts.indexOf(postId);
  if (index > -1) {
    // Remove bookmark
    bookmarkedPosts.splice(index, 1);
  } else {
    // Add bookmark
    bookmarkedPosts.push(postId);
  }
  
  saveUserData();
  
  // Update UI
  updateBookmarkUI(postId, index === -1);
  
  showToast(index === -1 ? 'Post bookmarked!' : 'Bookmark removed');
}

function updateBookmarkUI(postId, isBookmarked) {

  const mainBookmarkBtn = document.querySelector(`#mainPage .reaction-btn.bookmark[onclick*="${postId}"]`);
  if (mainBookmarkBtn) {
    const icon = mainBookmarkBtn.querySelector('i');
    mainBookmarkBtn.classList.toggle('active', isBookmarked);
    icon.className = isBookmarked ? 'bi bi-bookmark-fill' : 'bi bi-bookmark';
  }
  
  // Update in full post page
  const fullBookmarkBtn = document.querySelector(`#fullPostPage .reaction-btn.bookmark[onclick*="${postId}"]`);
  if (fullBookmarkBtn) {
    const icon = fullBookmarkBtn.querySelector('i');
    fullBookmarkBtn.classList.toggle('active', isBookmarked);
    icon.className = isBookmarked ? 'bi bi-bookmark-fill' : 'bi bi-bookmark';
  }
}

// Handle share
function handleShare(postId, title) {
  const postUrl = `${window.location.origin}${window.location.pathname}?post=${postId}`;

  if (navigator.share) {
    navigator.share({
      title: "SASTC DESK - " + title,
      text: title,
      url: postUrl
    }).then(() => {
      showToast("Shared successfully!");
    }).catch(err => console.log("Share failed:", err));
  } else {
    navigator.clipboard.writeText(postUrl).then(() => {
      showToast("Link copied to clipboard!");
    }).catch(err => {
      const textArea = document.createElement('textarea');
      textArea.value = postUrl;
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      showToast("Link copied to clipboard!");
    });
  }
}

// Toast notification
function showToast(msg) {
  const toast = document.createElement("div");
  toast.className = "toast-message";
  toast.innerText = msg;

  document.body.appendChild(toast);

  setTimeout(() => {
    toast.classList.add("show");
  }, 50);

  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// Title animation
function startTitleAnimation() {
  const texts = [
    "SASTC DESK",
    "Latest Notice Classes",
    "Always Up to date",
    "Never Miss an Update",
    "Mehedi Al Hasan Sawon",
    "Capture Every Moment on Campus",
    "Knowledge at Your Fingertips",
    "Never Miss Important Information",
    "Instant Class Alerts",
    "Grow Together",
    "Your Campus Log"
  ];

  let textIndex = 0;
  let charIndex = 0;
  let isDeleting = false;
  const titleElement = document.getElementById("animatedTitle");

  function typeEffect() {
    if (!titleElement) return;
    
    const currentText = texts[textIndex];
    const displayedText = currentText.substring(0, charIndex);
    titleElement.textContent = displayedText;

    if (!isDeleting && charIndex < currentText.length) {
      charIndex++;
      setTimeout(typeEffect, 100);
    } else if (isDeleting && charIndex > 0) {
      charIndex--;
      setTimeout(typeEffect, 50);
    } else {
      if (!isDeleting) {
        isDeleting = true;
        setTimeout(typeEffect, 1500);
      } else {
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
        setTimeout(typeEffect, 500);
      }
    }
  }

  typeEffect();
}

// Load posts from Firebase
function loadPosts() {
  database.ref('posts').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      posts = formatPosts(data);
      
      // Load comment counts
      loadCommentCounts();
      
      renderPosts();
    } else {
      posts = [];
      renderPosts();
    }
  }, (error) => {
    console.error("Firebase Error:", error);
    postsContainer.innerHTML = `
      <div class="empty-state">
        <i class="bi bi-wifi-off"></i>
        <h4 class="mt-3">Unable to load posts</h4>
        <p class="text-muted">Check your internet connection</p>
      </div>`;
  });
}

// Load comment counts
function loadCommentCounts() {
  posts.forEach(post => {
    database.ref(`comments/${post.id}`).once('value', (snapshot) => {
      const data = snapshot.val();
      commentCounts[post.id] = data ? Object.keys(data).length : 0;
      
      // Update UI if this post is currently displayed
      if (currentPostId === post.id) {
        const commentBtn = document.querySelector('.comment-btn span');
        if (commentBtn) {
          commentBtn.textContent = `Comments (${commentCounts[post.id]})`;
        }
      }
    });
  });
}

function formatPosts(data) {
  return Object.keys(data).map(key => ({
    id: key,
    ...data[key],
    likes: data[key].likes || 0,
    dislikes: data[key].dislikes || 0,
    views: data[key].views || 0
  }));
}

// Render posts based on filters
function renderPosts() {
  const searchTerm = searchInput.value.toLowerCase();
  const now = new Date();
  const twoHoursAgo = new Date(now.getTime() - (2 * 60 * 60 * 1000));

  const newPosts = posts
    .filter(post => new Date(post.createdAt) > twoHoursAgo)
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
    .slice(0, 3);

  let filteredPosts = posts.filter(post => {
    const matchesSearch = 
      post.title.toLowerCase().includes(searchTerm) ||
      post.content.toLowerCase().includes(searchTerm) ||
      (post.tags && post.tags.some(tag => tag.toLowerCase().includes(searchTerm)));

    let matchesType = true;
    if (currentFilter === 'bookmark') {
      matchesType = bookmarkedPosts.includes(post.id);
    } else if (currentFilter === 'weeklyPopular') {
      const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
      matchesType = new Date(post.createdAt) > oneWeekAgo;
    } else if (currentFilter !== 'all') {
      matchesType = post.type === currentFilter;
    }

    const isNew = newPosts.some(newPost => newPost.id === post.id);
    const matchesNewFilter = !showOnlyNew || isNew;

    return matchesSearch && matchesType && matchesNewFilter;
  });

  if (currentFilter === 'weeklyPopular') {
    filteredPosts.sort((a, b) => (b.views + b.likes) - (a.views + a.likes));
  } else {
    filteredPosts.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  }

  postsContainer.innerHTML = '';

  if (filteredPosts.length === 0) {
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';

    filteredPosts.forEach(post => {
      const postDate = new Date(post.createdAt);
      const isNew = newPosts.some(newPost => newPost.id === post.id);
      const isBookmarked = bookmarkedPosts.includes(post.id);
      const commentCount = commentCounts[post.id] || 0;

      const postEl = document.createElement('div');
      postEl.className = `post-card ${isNew ? 'new' : ''}`;
      postEl.setAttribute('data-post-id', post.id);

      const timeAgo = formatTimeAgo(postDate);

      postEl.innerHTML = `
        <div class="post-meta">
          <span class="post-type type-${post.type}">
            ${getTypeIcon(post.type)}
            ${post.type}
          </span>
          <span class="time-badge"><i class="bi bi-clock"></i> ${timeAgo}</span>
        </div>
        
        <div class="mb-3">
          <span class="post-detail-label">Title:</span>
          <h3 class="post-title">${post.title}</h3>
        </div>
        
        <div class="mb-3">
          <span class="post-detail-label">Details:</span>
          <p class="post-content" data-id="${post.id}">
            ${shortText(post.content)}
          </p>
        </div>
        
        ${post.image ? `
          <div class="post-image-container">
            <img src="${post.image}" class="post-image" data-img="${post.image}" alt="Post image">
          </div>
        ` : ''}
        
        ${post.linkUrl ? `
          <div class="mt-3">
            <span class="post-detail-label">Link:</span>            
            <a href="${post.linkUrl}" target="_blank" class="link-btn">
              <i class="bi bi-link-45deg"></i> ${post.linkTitle || 'View Link'}
            </a>
          </div>
        ` : ''}
        
        <div class="reaction-buttons">
          <button class="reaction-btn like ${userReactions[post.id] === 'like' ? 'active' : ''}" 
                  onclick="handleReaction('${post.id}', 'like')">
            <i class="bi bi-hand-thumbs-up"></i>
            <span class="like-count">${post.likes || 0}</span>
          </button>
          <button class="reaction-btn dislike ${userReactions[post.id] === 'dislike' ? 'active' : ''}" 
                  onclick="handleReaction('${post.id}', 'dislike')">
            <i class="bi bi-hand-thumbs-down"></i>
            <span class="dislike-count">${post.dislikes || 0}</span>
          </button>
          <button class="reaction-btn comment-btn" onclick="showFullPost('${post.id}', true)">
            <i class="bi bi-chat-left-text"></i>
            <span>${commentCount > 0 ? commentCount : ''}</span>
          </button>
          <button class="reaction-btn bookmark ${isBookmarked ? 'active' : ''}" 
                  onclick="toggleBookmark('${post.id}')">
            <i class="bi ${isBookmarked ? 'bi-bookmark-fill' : 'bi-bookmark'}"></i>
          </button>
          <button class="reaction-btn share-btn" onclick="handleShare('${post.id}', '${post.title.replace(/'/g, "\\'")}')">
            <i class="bi bi-share-fill"></i>
          </button>
        </div>
      `;

      postsContainer.appendChild(postEl);
    });

    // Add event listener for "Read more" links
    document.querySelectorAll('.read-more').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const card = this.closest('.post-card');
        const postId = card.getAttribute('data-post-id');
        showFullPost(postId, false);
      });
    });

    // Add event listeners to images for lightbox
    document.querySelectorAll('.post-image').forEach(img => {
      img.addEventListener('click', (e) => {
        showLightbox(e.currentTarget.dataset.img);
      });
    });
  }
}

// Show image in lightbox
function showLightbox(imgSrc) {
  lightboxImg.src = imgSrc;
  lightbox.classList.add('active');
}

// Format time ago
function formatTimeAgo(date) {
  const now = new Date();
  const seconds = Math.floor((now - date) / 1000);

  if (seconds < 60) return 'just now';

  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;

  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;

  const days = Math.floor(hours / 24);

  if (days >= 7) {
    return date.toLocaleDateString('en-GB', {
      day: '2-digit',
      month: 'long',
      year: 'numeric'
    });
  }

  return `${days}d ago`;
}

// Set up event listeners
function setupEventListeners() {
  // Search input
  if (searchInput) {
    searchInput.addEventListener('input', renderPosts);
  }

  // Filter buttons
  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderPosts();
    });
  });

  // Bookmark button
  if (bookmarkBtn) {
    bookmarkBtn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      currentFilter = 'bookmark';
      renderPosts();
    });
  }

  // Weekly popular button
  if (weeklyPopularBtn) {
    weeklyPopularBtn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      currentFilter = 'weeklyPopular';
      renderPosts();
    });
  }

  // Lightbox
  if (lightboxClose) {
    lightboxClose.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });
  }

  if (lightbox) {
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        lightbox.classList.remove('active');
      }
    });
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (lightbox.classList.contains('active')) {
        lightbox.classList.remove('active');
      } else if (fullPostPage && fullPostPage.style.display === 'block') {
        goBackToMain();
      }
    }
  });

  // Network status
  window.addEventListener('offline', () => {
    showOfflinePopup();
  });

  window.addEventListener('online', () => {
    hideOfflinePopup();
  });
}

// Show/hide offline popup
function showOfflinePopup() {
  if (offlinePopup) {
    offlinePopup.style.display = 'flex';
    setTimeout(() => {
      hideOfflinePopup();
    }, 3000);
  }
}

function hideOfflinePopup() {
  if (offlinePopup) {
    offlinePopup.style.display = 'none';
  }
}

// Security measures
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('selectstart', (e) => e.preventDefault());
document.addEventListener('copy', (e) => e.preventDefault());

document.addEventListener('keydown', function (e) {
  if (
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C" || e.key === "K")) ||
    (e.ctrlKey && e.key === "U") ||
    (e.ctrlKey && e.key === "S") ||
    (e.metaKey && e.key === "S")
  ) {
    e.preventDefault();
    return false;
  }
});

// Detect DevTools (basic protection)
let devToolsOpen = false;
const devToolsChecker = new Image();
Object.defineProperty(devToolsChecker, 'id', {
  get: function() {
    devToolsOpen = true;
    return 'devToolsDetected';
  }
});

setInterval(() => {
  devToolsOpen = false;
  console.log(devToolsChecker);
  if (devToolsOpen) {
    document.body.innerHTML = '<h1 style="color: white; text-align: center; margin-top: 50px;">Access Restricted</h1>';
    throw new Error('DevTools detected');
  }
}, 1000);
  </script>
